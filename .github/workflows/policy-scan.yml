name: Policy Scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          config_file: .checkov.yaml
          soft_fail: false
          output_format: cli
