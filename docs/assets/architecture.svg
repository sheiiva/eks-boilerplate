<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">AWS EKS landing zone architecture</title>
  <desc id="desc">Private VPC with public and private subnets, EKS control plane, Karpenter nodes, ALB ingress, External Secrets, and Terraform modules.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="960" height="520" rx="16" fill="url(#bg)"/>

  <!-- Title -->
  <text x="40" y="42" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">EKS Landing Zone</text>
  <text x="40" y="68" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Private VPC · EKS · Karpenter · ALB · External Secrets · Terraform</text>
  <a href="https://github.com/sheiiva/eks-boilerplate/releases/tag/v1.1.0">
    <rect x="820" y="28" width="100" height="28" rx="14" fill="#334155"/>
    <text x="870" y="47" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">v1.1.0</text>
  </a>

  <!-- VPC frame -->
  <rect x="40" y="96" width="880" height="300" rx="12" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
  <text x="56" y="120" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.08em">AWS VPC (private-by-default)</text>

  <!-- Public -->
  <rect x="60" y="140" width="200" height="230" rx="10" fill="#111827" stroke="#475569" stroke-width="1" filter="url(#shadow)"/>
  <text x="160" y="168" text-anchor="middle" fill="#38bdf8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">Public subnets</text>
  <rect x="80" y="188" width="160" height="44" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="160" y="215" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">NAT Gateway</text>
  <rect x="80" y="248" width="160" height="44" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="160" y="275" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">ALB (ingress)</text>
  <rect x="80" y="308" width="160" height="44" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="160" y="335" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Internet Gateway</text>

  <!-- Private -->
  <rect x="290" y="140" width="410" height="230" rx="10" fill="#111827" stroke="#475569" stroke-width="1" filter="url(#shadow)"/>
  <text x="495" y="168" text-anchor="middle" fill="#34d399" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">Private subnets</text>

  <rect x="310" y="188" width="170" height="70" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="395" y="218" text-anchor="middle" fill="#fbbf24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">EKS control plane</text>
  <text x="395" y="238" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">OIDC · IRSA · KMS</text>

  <rect x="500" y="188" width="180" height="70" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="590" y="218" text-anchor="middle" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">Karpenter</text>
  <text x="590" y="238" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">NodePool · EC2NodeClass</text>

  <rect x="310" y="278" width="370" height="70" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="495" y="308" text-anchor="middle" fill="#6ee7b7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">Worker nodes + workloads</text>
  <text x="495" y="328" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Bootstrap NG · spot/on-demand · apps</text>

  <!-- Platform -->
  <rect x="730" y="140" width="170" height="230" rx="10" fill="#111827" stroke="#475569" stroke-width="1" filter="url(#shadow)"/>
  <text x="815" y="168" text-anchor="middle" fill="#fb7185" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">Platform</text>
  <rect x="748" y="188" width="134" height="44" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="815" y="215" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">External Secrets</text>
  <rect x="748" y="248" width="134" height="44" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="815" y="275" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Secrets Manager</text>
  <rect x="748" y="308" width="134" height="44" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="815" y="335" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">ExternalDNS opt.</text>

  <!-- IaC bar -->
  <rect x="40" y="420" width="880" height="72" rx="12" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
  <text x="56" y="448" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.08em">TERRAFORM MODULES</text>
  <rect x="56" y="458" width="120" height="22" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="116" y="473" text-anchor="middle" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">remote-state</text>
  <rect x="188" y="458" width="100" height="22" rx="6" fill="#1e293b" stroke="#38bdf8"/>
  <text x="238" y="473" text-anchor="middle" fill="#e0f2fe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">network</text>
  <rect x="300" y="458" width="80" height="22" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="340" y="473" text-anchor="middle" fill="#fef3c7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">eks</text>
  <rect x="392" y="458" width="100" height="22" rx="6" fill="#1e293b" stroke="#a78bfa"/>
  <text x="442" y="473" text-anchor="middle" fill="#ede9fe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">karpenter</text>
  <rect x="504" y="458" width="90" height="22" rx="6" fill="#1e293b" stroke="#fb7185"/>
  <text x="549" y="473" text-anchor="middle" fill="#ffe4e6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">addons</text>
  <text x="640" y="473" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">’ environments/demo composition</text>

  <!-- Flow arrows -->
  <path d="M260,270 L290,270" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M700,223 L730,223" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
