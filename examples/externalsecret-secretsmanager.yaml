# Example ExternalSecret (AWS Secrets Manager)

Requires External Secrets Operator and a ClusterSecretStore (see companion file).

```yaml
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: demo-app
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: demo-app
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: eks-lz/demo/app
        property: password
```
